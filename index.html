<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioDefense: Zombie Outbreak - Web Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <header class="top-bar">
            <div>
                <h1>🧪 BioDefense: Zombie Outbreak</h1>
                <p>Verteidige das Labor gegen Zombie-Wellen in dieser mobilen Web-Neuinterpretation.</p>
            </div>
            <button id="start-wave-btn" class="btn btn-primary">Nächste Welle starten</button>
        </header>

        <main class="content-grid">
            <section class="battlefield-panel">
                <canvas id="game-canvas" width="900" height="560"></canvas>
                <div id="floating-message" class="floating-message"></div>
            </section>

            <aside class="hud-panel">
                <div class="hud-card stats-grid">
                    <div>
                        <span class="label">Leben</span>
                        <strong id="base-health">20</strong>
                    </div>
                    <div>
                        <span class="label">Credits</span>
                        <strong id="credits">180</strong>
                    </div>
                    <div>
                        <span class="label">Welle</span>
                        <strong id="wave">0</strong>
                    </div>
                    <div>
                        <span class="label">Kills</span>
                        <strong id="kills">0</strong>
                    </div>
                </div>

                <div class="hud-card">
                    <h2>Türme</h2>
                    <div id="tower-list" class="tower-list"></div>
                    <small>Tipp: Turm wählen, dann auf ein Feld links klicken.</small>
                </div>

                <div class="hud-card">
                    <h2>Spielkontrolle</h2>
                    <div class="controls">
                        <button id="pause-btn" class="btn">Pause</button>
                        <button id="speed-btn" class="btn">2x Tempo</button>
                        <button id="restart-btn" class="btn">Neu starten</button>
                    </div>
                </div>

                <div class="hud-card" id="selected-tower-card">
                    <h2>Ausgewählter Turm</h2>
                    <p id="selected-tower-text">Kein Turm ausgewählt</p>
                    <div class="controls">
                        <button id="upgrade-btn" class="btn" disabled>Upgrade</button>
                        <button id="sell-btn" class="btn btn-danger" disabled>Verkaufen</button>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
        <div class="modal-content">
            <h2 id="modal-title">Spiel vorbei</h2>
            <p id="modal-text"></p>
            <button id="modal-button" class="btn btn-primary">Erneut spielen</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
